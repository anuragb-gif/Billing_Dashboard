<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - Snowman Ops</title>
  <style>
    :root { --navy:#10222F; --teal:#0D9797; --line:#C8D0D8; --ink:#16212E; --muted:#5B6B7C; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #F4F6F8; color: var(--ink);
      font-family: 'IBM Plex Sans', -apple-system, Segoe UI, sans-serif;
    }
    .card {
      background: #fff; border: 1px solid #E1E6EB; border-radius: 8px;
      padding: 28px 26px; width: 320px; box-shadow: 0 1px 3px rgba(16,34,47,0.06);
    }
    .brand { font-weight: 600; font-size: 16px; }
    .sub { font-size: 12px; color: var(--muted); margin: 2px 0 20px; }
    label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
    input {
      width: 100%; margin-top: 6px; padding: 9px 11px; font-size: 14px;
      border: 1px solid var(--line); border-radius: 4px; font-family: inherit;
    }
    button {
      width: 100%; margin-top: 16px; padding: 9px 12px; font-size: 14px; font-weight: 500;
      color: #fff; background: var(--teal); border: 0; border-radius: 4px; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    .err { margin-top: 12px; font-size: 12.5px; color: #C0392B; min-height: 16px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand">Snowman Ops</div>
    <div class="sub">Warehouse reporting</div>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus />
    <button type="submit" id="btn">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    const f = document.getElementById('f');
    const err = document.getElementById('err');
    const btn = document.getElementById('btn');
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('pw').value }),
        });
        if (res.ok) {
          const params = new URLSearchParams(location.search);
          location.href = params.get('next') || '/';
          return;
        }
        const body = await res.json().catch(() => ({}));
        err.textContent = body.error || 'Sign in failed.';
      } catch (_) {
        err.textContent = 'Could not reach the server.';
      }
      btn.disabled = false;
    });
  </script>
</body>
</html>
